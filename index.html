<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#26272B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aurum">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Aurum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: left rail on desktop, bottom tab bar on phones; content as cards on a cool paper ground */
  /* Gray and gold: one charcoal world, gold as the accent */
  --bg:#26272B; --surface:#313237; --ink:#F3EEE3; --muted:#B0ABA0; --line:#44454B;
  --accent:#D9B440; --accent-ink:#1E1F22; --accent-soft:#4A4130;
  --flame:#E9A23B; --flame-soft:#2E2210;
  --good:#5BC48C; --good-soft:#12291C;
  --amber:#D4AF37; --violet:#A98BFF;
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,monospace;
  --radius:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
/* phones: no double-tap-zoom wait, no grey tap flash, instant press feedback */
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
*{-webkit-tap-highlight-color:transparent}
button,a,[role="button"],.chip,.tab,.nav{touch-action:manipulation}
button:active,.nav:active,.chip:active,.tab:active,[role="button"]:active{transform:scale(.97)}
@media (hover:none){.nav:hover{background:none;color:var(--muted)}.nav[aria-current="page"]:hover{background:var(--accent-soft);color:var(--accent)}.btn:hover{border-color:var(--line)}}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:28px;font-weight:700;color:#F6E7B8}
h2{font-size:17px;font-weight:700}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:220px 1fr;height:100%}
.rail{border-right:1px solid color-mix(in srgb,var(--accent) 25%,var(--line));padding:20px 12px;display:flex;flex-direction:column;gap:4px;background:var(--surface);overflow-y:auto}
.brand{font-family:var(--font-display);font-weight:700;font-size:22px;padding:4px 10px 16px;display:flex;align-items:center;gap:8px}
.brand{color:var(--accent);letter-spacing:.02em}
.brand i{width:10px;height:10px;border-radius:2px;background:linear-gradient(135deg,#F5D97A,#B8901F);display:inline-block;transform:rotate(45deg)}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;border:0;background:none;cursor:pointer;text-align:left;color:var(--muted);font-weight:500}
.nav svg{width:18px;height:18px;flex:none}
.nav:hover{background:var(--bg);color:var(--ink)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.rail .sync{margin-top:auto;font-size:12px;color:var(--muted);padding:10px;display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--good)} .dot.err{background:var(--flame)}

main{overflow-y:auto;padding:28px 32px 40px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sub{color:var(--muted);margin:4px 0 0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);box-shadow:inset 0 1px 0 color-mix(in srgb,var(--accent) 22%,transparent);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:linear-gradient(180deg,#E6C35A,#C9A227);border-color:#C9A227;color:#1E1F22;font-weight:600}
.btn.ghost{border-color:transparent;background:none;color:var(--muted);padding:6px 8px}
.btn.ghost:hover{color:var(--ink);background:var(--bg)}
.btn.sm{padding:5px 10px;font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-width:0}
.input:focus{border-color:var(--accent);outline:none}
.addrow{display:flex;gap:8px}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat b{display:block;font-family:var(--font-mono);font-size:24px;font-weight:500}
.stat span{font-size:13px;color:var(--muted)}
.stat.flame b{color:var(--flame)}

.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.item.done .grow{color:var(--muted);text-decoration:line-through}
.check{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--muted);background:none;cursor:pointer;flex:none;display:grid;place-items:center;padding:0}
.check.on{background:var(--good);border-color:var(--good)}
.check.on::after{content:"";width:10px;height:6px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.x{opacity:.45}
.item:hover .x{opacity:1}

.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--bg);color:var(--muted);white-space:nowrap}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.flame{background:var(--flame-soft);color:var(--flame)}
.pill.good{background:var(--good-soft);color:var(--good)}

.block{border-left:4px solid var(--c,var(--accent));background:var(--bg);border-radius:8px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:1px;text-align:left;border-top:0;border-right:0;border-bottom:0;width:100%}
.block .t{font-weight:600;overflow-wrap:anywhere}
.block .tm{font-size:12px;color:var(--muted)}
.block.now{box-shadow:0 0 0 2px var(--c,var(--accent)) inset}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.day{display:flex;flex-direction:column;gap:8px;min-width:0}
.day h3{font-size:14px;font-family:var(--font-body);font-weight:600;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.day.today h3{color:var(--accent)}

.ev{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.ev:first-child{border-top:0}
.cal{width:48px;flex:none;text-align:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.cal small{display:block;background:var(--flame);color:#fff;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.cal b{display:block;font-family:var(--font-mono);font-size:18px;padding:2px 0}

.bars{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;align-items:end;height:150px;padding-top:18px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to top,transparent 0,transparent 37px,var(--line) 37px,var(--line) 38px)}
.bar{position:relative;background:var(--accent);border-radius:6px 6px 0 0;min-height:2px;opacity:.55}
.bar.cur{opacity:1}
.bar span{position:absolute;top:-18px;left:0;right:0;text-align:center;font:500 11px var(--font-mono);color:var(--muted)}
.barlbl{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;font-size:11px;color:var(--muted);text-align:center}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.study{cursor:pointer}
.study p{margin:0;color:var(--muted);font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}

.streak .big{font-family:var(--font-mono);font-size:34px;color:var(--flame);line-height:1}
.dots{display:grid;grid-template-columns:repeat(21,1fr);gap:3px}
.dots i{aspect-ratio:1;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--flame)}
.dots i.today{outline:1.5px solid var(--ink);outline-offset:1px}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);color:var(--ink);border-radius:var(--radius);padding:12px 16px;font-size:14px}

/* AI */
.chat{display:flex;flex-direction:column;gap:12px;min-height:200px}
.msg{max-width:85%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--bg);border-bottom-left-radius:4px}
.msg.note{align-self:center;font-size:12px;color:var(--muted);background:none;padding:0}
.ask{display:flex;gap:8px;align-items:flex-end}
.ask textarea{resize:none;min-height:44px;max-height:140px}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,14,22,.45);display:grid;place-items:center;z-index:50;padding:16px}
.sheet{background:var(--surface);border-radius:18px;padding:20px;width:100%;max-width:440px;max-height:90%;overflow-y:auto;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.tabbar{display:none}

@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .rail{display:none}
  main{padding:18px 16px 24px}
  .tabbar{display:flex;overflow-x:auto;background:var(--surface);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
  .tabbar .nav{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;min-width:64px;flex:1;align-items:center}
  .g2,.g3{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .week{grid-template-columns:1fr}
  .day h3{font-size:15px}
  h1{font-size:24px}
  .msg{max-width:92%}
}

/* gym */
:root{--teal:#3FC7C2}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;width:fit-content;max-width:100%;overflow-x:auto;position:sticky;top:8px;z-index:20;box-shadow:0 6px 18px rgba(0,0,0,.35);touch-action:pan-y}
.tab{border:0;background:none;padding:7px 16px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.mg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mgbtn{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:14px 6px;cursor:pointer;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px}
.mgbtn i{width:12px;height:12px;border-radius:50%;background:var(--g)}
.mgbtn[aria-pressed="true"]{border-color:var(--g);background:color-mix(in srgb,var(--g) 16%,var(--surface))}
.logbtn{font-size:16px;padding:14px;border-radius:12px;width:100%;white-space:normal}
.logbtn:disabled{background:var(--line);border-color:var(--line);color:var(--muted);cursor:not-allowed}
.locked{display:flex;align-items:center;gap:14px;padding:16px;border-radius:12px;background:var(--good-soft)}
.locked .seal{width:48px;height:48px;border-radius:50%;background:var(--good);display:grid;place-items:center;color:#fff;font-size:24px;flex:none}
.calhead,.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.calhead span{font-size:12px;color:var(--muted);text-align:center;font-weight:600}
.cd{aspect-ratio:1;border-radius:10px;background:var(--bg);border:1.5px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:500 14px var(--font-mono);cursor:pointer;padding:2px;color:var(--ink);min-width:0}
.cd.blank{background:none;cursor:default}
.cd.future{opacity:.4;cursor:default}
.cd.went{background:var(--accent);color:var(--accent-ink)}
.cd.today{border-color:var(--ink)}
.cd.sel{box-shadow:0 0 0 2px var(--flame)}
.gd{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.gd i{width:6px;height:6px;border-radius:50%;background:var(--g);box-shadow:0 0 0 1px var(--surface)}
.yr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.mini{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left}
.mini:hover{border-color:var(--accent)}
.mini .calgrid{gap:2px}
.mini .cd{border-radius:3px;cursor:inherit;border-width:1px;padding:0}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wkd{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:110px;background:var(--bg);min-width:0}
.wkd.went{background:var(--accent-soft);border-color:var(--accent)}
.wkd.today{box-shadow:0 0 0 1.5px var(--ink)}
.hb{display:grid;grid-template-columns:80px 1fr 28px;gap:8px 10px;align-items:center;font-size:14px}
.hbt{height:10px;background:var(--bg);border-radius:6px;overflow:hidden}
.hbt div{height:100%;border-radius:6px;min-width:2px}
@media (max-width:860px){
  .tabs{width:100%;justify-content:space-between}.tabs .tab{flex:1;padding:8px 6px}
  .mg{grid-template-columns:repeat(4,minmax(0,1fr))}
  .mgbtn{padding:12px 4px;font-size:13px}
  .yr{grid-template-columns:repeat(2,minmax(0,1fr))}
  .wk{grid-template-columns:1fr}
  .wkd{min-height:0}
  .calhead,.calgrid{gap:4px}
  .cd{font-size:13px;border-radius:8px}
  .gd i{width:5px;height:5px}
}

/* study subjects */
.subjgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.subj{position:relative;border:1px solid var(--line);border-top:6px solid var(--s);border-radius:16px;background:linear-gradient(160deg,color-mix(in srgb,var(--s) 13%,var(--surface)) 0%,var(--surface) 60%);padding:14px 16px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left;min-height:190px;transition:transform .15s,box-shadow .15s}
.subj:hover{transform:translateY(-2px);box-shadow:0 8px 24px color-mix(in srgb,var(--s) 25%,transparent);border-color:var(--s)}
.subj-top{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.subj-area{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--s)}
.subj-sym{font-family:var(--font-display);font-weight:700;font-size:clamp(22px, calc(150px / var(--len, 3)), 44px);line-height:1;color:var(--s);margin-top:4px;letter-spacing:.01em;white-space:nowrap}
.subj-sym.big{font-size:clamp(15px, calc(130px / var(--len, 3)), 34px);min-width:76px;height:76px;padding:0 14px;border-radius:18px;background:var(--s);color:#fff;display:grid;place-items:center;flex:none}
.subj-name{font-family:var(--font-display);font-weight:700;font-size:17px;line-height:1.2;text-wrap:balance}
.subj-foot{margin-top:auto;display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.subj-hero{display:flex;gap:16px;align-items:center;padding:18px;border-radius:18px;border:1px solid var(--line);border-left:6px solid var(--s);background:linear-gradient(120deg,color-mix(in srgb,var(--s) 16%,var(--surface)),var(--surface) 70%)}
.syl{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;border:1px solid var(--line);text-decoration:none;color:var(--ink);margin-bottom:8px;background:var(--bg)}
.syl:hover{border-color:var(--s)}
.syl-ic{width:42px;height:48px;border-radius:8px;background:var(--s);color:#fff;font:700 11px var(--font-mono);display:grid;place-items:center;flex:none}
@media (max-width:1100px){.subjgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:860px){.subjgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.subj{min-height:160px;padding:12px}.subj-sym{font-size:clamp(18px, calc(118px / var(--len, 3)), 36px)}.subj-name{font-size:15px}.subj-foot span:first-child{display:none}}

/* school timetable */
.tt-title{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:20px;border-radius:18px;background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--accent)}
.tt-eyebrow{margin:0 0 4px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tt-wrap{overflow-x:auto}
.ttgrid{display:grid;grid-template-columns:64px repeat(3,minmax(84px,1fr)) 30px repeat(2,minmax(84px,1fr)) 30px repeat(3,minmax(84px,1fr));grid-template-rows:auto repeat(6,minmax(64px,auto));gap:6px;min-width:860px}
.tt-corner{grid-row:1;grid-column:1}
.tt-h{grid-row:1;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);padding-bottom:4px}
.tt-h b{font-family:var(--font-display);font-size:16px;color:var(--ink)}
.tt-h.tt-brk{writing-mode:vertical-rl;transform:rotate(180deg);justify-content:center;align-items:center;font-size:0}
.tt-h.tt-brk b{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tt-day{grid-column:1;display:flex;flex-direction:column;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:16px;padding-left:4px}
.tt-day small{font:600 10px var(--font-body);text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.tt-day.cur{color:var(--accent)}
.tt-c{border-radius:10px;padding:8px 10px;background:color-mix(in srgb,var(--s) 14%,var(--surface));border-left:4px solid var(--s);display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0}
.tt-c b{font-family:var(--font-display);font-size:14px;color:var(--s);letter-spacing:.02em}
.tt-c span{font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.tt-c.live{box-shadow:0 0 0 2px var(--s)}
.tt-free{border-radius:10px;border:1.5px dashed var(--line);display:grid;place-items:center;font-size:12px;color:var(--muted)}
.tt-gap{border-radius:8px;background:repeating-linear-gradient(135deg,var(--line) 0 2px,transparent 2px 8px);opacity:.6}
.tt-mobile{display:none}
.tt-li{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;border-left:4px solid var(--s,var(--line));background:color-mix(in srgb,var(--s,var(--bg)) 10%,var(--surface));margin-top:6px}
.tt-li.free{border-left-style:dashed}
.tt-li.live{box-shadow:0 0 0 2px var(--s)}
.tt-li .tm{font-size:12px;color:var(--muted);width:118px;flex:none}
@media (max-width:860px){.tt-wrap{display:none}.tt-mobile{display:flex}.tt-li .tm{width:96px;font-size:11px}}

.pack{border-radius:20px;padding:20px;background:#2B2C30;color:var(--ink);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);display:flex;flex-direction:column;gap:16px}
.pack h2{font-size:22px;color:var(--ink)}

<body>
<div class="app">
  <nav class="rail" id="rail" aria-label="Sections"></nav>
  <main id="main"><div class="wrap"><p class="muted">Loading your Aurum…</p></div></main>
  <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
</div>
<div id="sheetRoot"></div>
<div class="auth" id="auth" hidden>
  <form class="auth-card" id="authForm">
    <div class="auth-logo"><i></i>Aurum</div>
    <p class="muted" style="margin:0" id="authLead">Sign in to sync your data across your phone and PC.</p>
    <div class="field"><label for="authEmail">Email</label><input class="input" id="authEmail" type="email" autocomplete="email" required></div>
    <div class="field"><label for="authPass">Password</label><input class="input" id="authPass" type="password" autocomplete="current-password" minlength="6" required></div>
    <p class="auth-err" id="authErr"></p>
    <button class="btn primary" id="authBtn" style="padding:12px">Sign in</button>
    <button type="button" class="auth-switch" id="authSwitch">New here? Create an account</button>
    <button type="button" class="auth-switch" id="authReset" style="color:var(--muted)">Forgot password?</button>
  </form>
</div>

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYMD = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseYMD(s); d.setDate(d.getDate()+n); return ymd(d); };
const today = () => ymd(new Date());
const daysBetween = (a, b) => Math.round((parseYMD(b) - parseYMD(a)) / 864e5);
const dow = s => (parseYMD(s).getDay() + 6) % 7; // Mon=0
const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtDate = s => { const d = parseYMD(s); return `${DAYS[dow(s)].slice(0,3)}, ${MON[d.getMonth()]} ${d.getDate()}`; };
const fmtTime = t => { if (!t) return ""; let [h,m] = t.split(":").map(Number); const ap = h >= 12 ? "pm" : "am"; h = h % 12 || 12; return `${h}:${pad(m)}${ap}`; };
const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const COLORS = { blue:"var(--accent)", coral:"var(--flame)", green:"var(--good)", amber:"var(--amber)", violet:"var(--violet)", addmath:"#4F46E5", math:"#0284C7", english:"#E11D48", pob:"#B45309", it:"#0D9488", chem:"#A21CAF", bio:"#15803D", phys:"#EA580C" };
const weekStart = s => addDays(s, -dow(s));

/* ---------- state ---------- */
const SECTIONS = ["todos","schedule","events","gym","study","streaks","meta","health","lifts"];
let S = { todos:{}, schedule:[], events:[], gym:{}, study:[], streaks:[], meta:{}, health:{}, lifts:[] };
let chat = [];
let view = "today", taskDate = today(), studySubject = null;

function seed() {
  const t = today();
  S.health = {}; S.lifts = []; S.todos = {}; S.schedule = LESSONS(); S.events = []; S.gym = {}; S.study = []; S.streaks = [];
  S.meta = { sample: false, created: t, studyV2: true, lockV1: true, schedV1: true, debateV1: true, dailyV1: true, dailyV2: true, dailyV3: true,
    lockedIn: { start: "2026-10-25" }, dailyTasks: DEFAULT_DAILY.map(x => ({ ...x })), dailySince: t };
}

/* ---------- persistence: synced db, with this-device cache as fallback ---------- */
let db = null, colPath = null, syncState = "local";
const timers = {}, timerActive = {}, writing = {};
function cacheLocal() { try { localStorage.setItem("aurum-cache", JSON.stringify(S)); } catch (e) {} }
function loadLocal() { try { const raw = localStorage.getItem("aurum-cache"); if (raw) { const v = JSON.parse(raw); SECTIONS.forEach(k => { if (v[k] !== undefined) S[k] = v[k]; }); return true; } } catch (e) {} return false; }
function save(...secs) {
  cacheLocal();
  if (!db) return;
  secs.forEach(sec => { clearTimeout(timers[sec]); timerActive[sec] = true; timers[sec] = setTimeout(() => flush(sec), 500); });
}
async function flush(sec) {
  timerActive[sec] = false;
  if (writing[sec]) { timerActive[sec] = true; timers[sec] = setTimeout(() => flush(sec), 300); return; }
  writing[sec] = true;
  try { await db.collection(colPath).doc(sec).set({ json: JSON.stringify(S[sec]), updated: Date.now() }); setSync("ok"); }
  catch (e) { setSync("err"); }
  finally { writing[sec] = false; }

function setSync(s) { syncState = s; const el = document.querySelectorAll(".syncText"); const txt = s === "ok" ? "Synced across your devices" : s === "err" ? "Sync problem: saved on this device" : s === "wait" ? "Offline: changes will sync" : "Saved on this device only"; el.forEach(e => { e.textContent = txt; e.previousElementSibling.className = "dot " + (s === "ok" ? "ok" : s === "err" ? "err" : ""); }); }

async function connect() {
  setSync("wait");
  try {
    db = firebase.firestore(); colPath = "users/" + fbUser.uid + "/data";
    let first = true;
    const loadTimer = setTimeout(() => { if (first) setSync("err"); }, 10000);
    const handle = snap => {
      clearTimeout(loadTimer);
      const docs = snap.docs || [];
      if (first) {
        if (!docs.length && snap.metadata && snap.metadata.fromCache) return; // wait for the server before deciding this is a new account
        first = false;
        if (!docs.length) { seed(); migrate(); save(...SECTIONS); render(); setSync("ok"); return; }
      }
      let changed = false;
      docs.forEach(d => {
        const key = d.id; if (!SECTIONS.includes(key)) return;
        if (timerActive[key] || writing[key]) return;
        const data = d.data();
        if (!data || typeof data.json !== "string") return;
        if (data.json === JSON.stringify(S[key])) return;
        try { S[key] = JSON.parse(data.json); changed = true; } catch (e) {}
      });
      if (changed) { migrate(); cacheLocal(); render(); }
      setSync(snap.metadata && snap.metadata.fromCache ? "wait" : "ok");
    };
    unsub = db.collection(colPath).onSnapshot({ includeMetadataChanges: false }, handle, () => setSync("err"));
  } catch (e) { setSync("err"); }
}

/* ---------- lesson reminders via iPhone Calendar (.ics) ---------- */
const remindOn = b => b.remind === true || b.remind === "yes" ? true : b.remind === false || b.remind === "no" ? false : !/debate/i.test(b.title);
function lessonsICS() {

    ...ev, "END:VCALENDAR"].join("\r\n");
}

/* ---------- gym ---------- */
const GROUPS = [["back","Back"],["bi","Biceps"],["chest","Chest"],["tri","Triceps"],["shoulders","Shoulders"],["legs","Legs"],["abs","Abs"],["forearms","Forearms"]];
const GNAME = Object.fromEntries(GROUPS);
const GCOL = { back:"#3B82F6", bi:"#A78BFA", chest:"#EF4444", tri:"#F59E0B", shoulders:"#22C55E", legs:"#14B8A6", abs:"#EC4899", forearms:"#84CC16" };
let gymFreq = "week", gymTab = "today", gymCursor = today(), gymSel = null, gymPick = new Set();
const gymDays = () => Object.keys(S.gym || {}).sort();
const wentOn = d => !!(S.gym && S.gym[d]);
function gymCount(from, to) { return gymDays().filter(d => d >= from && d <= to).length; }
function groupCounts(from, to) { const c = {}; GROUPS.forEach(([k]) => c[k] = 0); gymDays().filter(d => d >= from && d <= to).forEach(d => (S.gym[d].groups || []).forEach(g => c[g] = (c[g] || 0) + 1)); return c; }
function lastTrained(g) { const ds = gymDays().filter(d => (S.gym[d].groups || []).includes(g)); return ds.length ? ds[ds.length - 1] : null; }
function logGymToday() {
  const t = today();
  if (wentOn(t)) return false;
  if (!gymPick.size) return false;
  S.gym[t] = { groups: GROUPS.map(g => g[0]).filter(k => gymPick.has(k)), at: Date.now() };
  gymPick = new Set(); save("gym"); return true;
}
function gdots(d) { return wentOn(d) ? `<span class="gd">${(S.gym[d].groups || []).map(g => `<i style="--g:${GCOL[g]}"></i>`).join("")}</span>` : ""; }
function gpills(d) { return (S.gym[d]?.groups || []).map(g => `<span class="pill" style="background:color-mix(in srgb, ${GCOL[g]} 18%, transparent);color:var(--ink)">${GNAME[g]}</span>`).join(" "); }
function breakdown(from, to) {
  const c = groupCounts(from, to), max = Math.max(1, ...Object.values(c));
  return `<div class="hb">${GROUPS.map(([k, n]) => `<span>${n}</span><div class="hbt"><div style="width:${c[k] / max * 100}%;background:${GCOL[k]}"></div></div><span class="num">${c[k]}</span>`).join("")}</div>`;
}
function monthCal(y, m, { mini = false } = {}) {
  const first = new Date(y, m, 1), off = (first.getDay() + 6) % 7, n = new Date(y, m + 1, 0).getDate(), t = today();
  let cells = Array.from({ length: off }, () => `<span class="cd blank"></span>`).join("");
  for (let i = 1; i <= n; i++) {
    const d = ymd(new Date(y, m, i)), cls = ["cd", wentOn(d) && "went", d === t && "today", d > t && "future", !mini && d === gymSel && "sel"].filter(Boolean).join(" ");

function vGym() {

    return `${head}

      return `<div class="item"><i style="width:10px;height:10px;border-radius:50%;background:${GCOL[k]};flex:none"></i><span class="grow">${n}</span><span class="pill ${ago === null ? "" : ago >= 7 ? "flame" : ago <= 2 ? "good" : "accent"}">${ago === null ? "Not yet" : ago === 0 ? "Today" : ago === 1 ? "Yesterday" : ago + " days ago"}</span></div>`; }).join("")}</div></section>`;
  }

  if (gymTab === "week") {

    if (gymFreq === "week") { from = weekStart(gymCursor); to = addDays(from, 6); label = `${MON[parseYMD(from).getMonth()]} ${parseYMD(from).getDate()} – ${MON[parseYMD(to).getMonth()]} ${parseYMD(to).getDate()}`; }

/* ---------- locked in counter ---------- */
const MILESTONES = [7, 14, 21, 30, 45, 60, 90, 120, 180, 270, 365, 500, 730, 1000];
function lockInfo() {
  const L = S.meta && S.meta.lockedIn; if (!L) return null;
  const t = today(), days = Math.max(0, daysBetween(L.start, t) + 1);
  const next = MILESTONES.find(m => m > days) || Math.ceil((days + 1) / 365) * 365;
  const prev = [...MILESTONES].reverse().find(m => m <= days) || 0;
  return { start: L.start, days, next, prev, best: Math.max(L.best || 0, days), nextDate: addDays(L.start, next - 1), pct: (days - prev) / (next - prev) };
}
function lockSpan(d) { const w = Math.floor(d / 7), r = d % 7; return [w && `${w} week${w > 1 ? "s" : ""}`, r && `${r} day${r > 1 ? "s" : ""}`].filter(Boolean).join(", ") || "0 days"; }
function vStreaks() {
  const L = lockInfo();
  if (!L) return `<div class="head"><div><h1>Streaks</h1></div></div><section class="card"><button class="btn primary" data-act="lockStart">Start a Locked in streak</button></section>`;
  const R = 92, C = 2 * Math.PI * R, sd = parseYMD(L.start);
  return `<div class="head"><div><h1>Streaks</h1><p class="sub">One streak. Every day counts.</p></div></div>
  <section class="lock">
    <div class="lock-ring">
      <svg viewBox="0 0 220 220" aria-hidden="true"><circle cx="110" cy="110" r="${R}" class="lr-bg"/><circle cx="110" cy="110" r="${R}" class="lr-fg" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - L.pct)}"/></svg>
      <div class="lock-num"><b class="num">${L.days}</b><span>day${L.days === 1 ? "" : "s"}</span></div>
    </div>
    <div class="lock-body">
      <p class="lock-k">Locked in</p>
      <h2 class="lock-h">${lockSpan(L.days)} strong.</h2>
      <p class="lock-sub">Since ${DAYS[dow(L.start)]}, ${MON[sd.getMonth()]} ${sd.getDate()}, ${sd.getFullYear()}. Adds one every day on its own.</p>
      <div class="lock-next"><div class="row" style="justify-content:space-between"><span>Next: <b>${L.next} days</b></span><span class="num">${L.next - L.days} to go · ${fmtDate(L.nextDate)}</span></div><div class="lock-bar"><i style="width:${Math.round(L.pct * 100)}%"></i></div></div>
    </div>
  </section>
  <div class="stats">
    <div class="stat"><b>${L.days}</b><span>days locked in</span></div>
    <div class="stat"><b>${Math.floor(L.days / 7)}</b><span>full weeks</span></div>
    <div class="stat"><b>${MILESTONES.filter(m => m <= L.days).length}</b><span>milestones hit</span></div>
    <div class="stat"><b>${L.best}</b><span>best ever</span></div>
  </div>
  <section class="card"><h2>Milestones</h2>
    <div class="badges">${MILESTONES.map(m => `<div class="badge ${m <= L.days ? "on" : m === L.next ? "nextb" : ""}"><b class="num">${m}</b><span>${m <= L.days ? "Unlocked" : m === L.next ? `${m - L.days} to go` : "days"}</span></div>`).join("")}</div>
  </section>
  <div class="row" style="justify-content:flex-end"><button class="btn ghost sm" data-act="lockEdit">Change start date</button><button class="btn ghost sm" style="color:var(--flame)" data-act="lockReset">Reset to day 1</button></div>`;
}

      setTimeout(() => { const b = document.querySelector('[data-act="sheetDelete"]'); if (b) b.textContent = "Reset streak"; const s = document.querySelector('.sheet .btn.primary'); if (s) s.remove(); }); break; }
    case "clearSample": openForm("Clear all sample data?", [], {}, () => {}, () => { S = { todos: {}, schedule: [], events: [], gym: {}, study: [], streaks: [], meta: { sample: false, created: today(), studyV2: true, lockV1: true, schedV1: true, debateV1: true, dailyV1: true, dailyV2: true, dailyV3: true, dailyTasks: S.meta.dailyTasks, dailySince: S.meta.dailySince, lockedIn: S.meta.lockedIn } }; save(...SECTIONS); render(); });
      setTimeout(() => { const b = document.querySelector('[data-act="sheetDelete"]'); if (b) b.textContent = "Clear everything"; const s = document.querySelector('.sheet .btn.primary'); if (s) s.remove(); }); break;
    case "quickAsk": ask(el.dataset.q); break;
    case "clearChat": chat = []; render(); break;
  }
});
document.addEventListener("change", e => {
  if (e.target.dataset.change === "cycle") { const n = +e.target.value; if (!n) return; S.meta.cycle = { date: nextSchoolDay(today()), day: n }; ttDay = null; save("meta"); render(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if (sheetHandlers) { closeSheet(); return; }
    const el = document.activeElement;
    if (el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) { el.blur(); return; }
    e.preventDefault(); backOut(); return;
  }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
  if (e.key === "Enter" && !e.shiftKey && e.target.id === "askIn") { e.preventDefault(); e.target.form.requestSubmit(); }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  const form = e.target, kind = form.dataset.form;
  if (kind === "todo") { const inp = form.querySelector("input"), v = inp.value.trim(); if (!v) return; todosFor(form.dataset.d).push({ id: uid(), text: v, done: false }); save("todos"); render(); const again = document.getElementById(inp.id); again && again.focus(); }
  if (kind === "sheet" && sheetHandlers) {
    const vals = {}; sheetHandlers.fields.forEach(fl => { let v = document.getElementById("f-" + fl.k).value; if (fl.k === "day") v = +v; if (fl.type === "number") v = +v; vals[fl.k] = typeof v === "string" ? v.trim() : v; });
    if (vals.start && vals.end && vals.end <= vals.start) { alertField("f-end", "End time must be after the start time."); return; }
    const h = sheetHandlers; closeSheet(); h.onSave(vals);
  }
  if (kind === "daily") { const inp = form.querySelector("input"), v = inp.value.trim(); if (!v) return; S.meta.dailyTasks = [...dailyList(), { id: uid(), text: v }]; if (!S.meta.dailySince) S.meta.dailySince = today(); save("meta"); render(); const q = document.getElementById("dailyIn"); q && q.focus(); }
  if (kind === "quickEvent") { const inp = form.querySelector("input"), v = inp.value.trim(); if (!v) return; const isB = /birthday|b-day|bday/i.test(v); S.events.push({ id: uid(), title: v, date: evSel, time: "", notes: "", type: isB ? "birthday" : "event", repeat: isB ? "yearly" : "" }); save("events"); render(); const q = document.getElementById("qeIn"); q && q.focus(); }
  if (kind === "ask") { const inp = $("#askIn"); const q = inp.value.trim(); if (q) { inp.value = ""; ask(q); } }
});
function alertField(id, msg) { const el = document.getElementById(id); el.setCustomValidity(msg); el.reportValidity(); el.addEventListener("input", () => el.setCustomValidity(""), { once: true }); }

/* ---------- assistant ---------- */
function aiContext() {
  const t = today();
  const todos = {}; for (let i = -1; i <= 7; i++) { const d = addDays(t, i); const vt = visibleTodos(d); if (vt.length) todos[d] = vt.map(x => (x.done ? "[x] " : "[ ] ") + x.text); }
  return {
    today: `${DAYS[dow(t)]} ${t}`, current_time: nowHM(),
    tasks_by_date: todos,
    weekly_schedule: S.schedule.slice().sort((a, b) => a.day - b.day || a.start.localeCompare(b.start)).map(b => `${DAYS[b.day]} ${b.start}-${b.end} ${b.title}`),
    upcoming_events: upcomingEvents(90).map(e => `${e.date}${e.time ? " " + e.time : ""} ${e.title}${e.notes ? " (" + e.notes + ")" : ""}`),
    gym_log_last_90_days: gymDays().filter(d => d >= addDays(t, -89)).map(d => `${d} ${DAYS[dow(d)]}: ${(S.gym[d].groups || []).map(g => GNAME[g]).join(", ")}`),
    gym_logged_today: wentOn(t),
    gym_totals: { this_week: gymCount(weekStart(t), t), this_month: gymCount(t.slice(0, 8) + "01", t), this_year: gymCount(t.slice(0, 4) + "-01-01", t), all_time: gymDays().length },
    muscle_group_last_trained: Object.fromEntries(GROUPS.map(([k, n]) => [n, lastTrained(k) || "never"])),
    school_timetable_today: (() => { const c = classesOn(t); return c ? { cycle_day: c.day, classes: c.list.map(e => `${ttTime(e)} ${SUBJ[e[0]].name}`) } : "no school today or cycle day not set"; })(),
    school_timetable_all_days: Object.fromEntries(Object.entries(TT).map(([d, l]) => ["Day " + d, l.map(e => `${PERIODS[e[1]][0]}-${PERIODS[e[2]][1]} ${e[0] === "free" ? "Free" : SUBJ[e[0]].name}`)])),
    csec_subjects: SUBJECTS.map(s => s.name),
    study_materials: S.study.map(s => `[${SUBJ[s.subject] ? SUBJ[s.subject].name : s.subject}] ${s.title}${s.notes ? " - " + s.notes.slice(0, 200) : ""} (saved ${s.created || "?"})`),
    locked_in_streak: (() => { const L = lockInfo(); return L ? `${L.days} days locked in since ${L.start}; next milestone ${L.next} days on ${L.nextDate}; best ever ${L.best}` : "none"; })()
  };
}
const dateProp = { type: "string", description: "Date as YYYY-MM-DD. Defaults to today." };
const AI_TOOLS = [
  { name: "add_task", description: "Add a new daily task that repeats on the user's checklist every day.", inputSchema: { type: "object", properties: { text: { type: "string" } }, required: ["text"] },
    execute: i => { S.meta.dailyTasks = [...dailyList(), { id: uid(), text: i.text }]; if (!S.meta.dailySince) S.meta.dailySince = today(); save("meta"); return { ok: true }; } },
  { name: "complete_task", description: "Mark a task as done by matching its text.", inputSchema: { type: "object", properties: { text: { type: "string" }, date: dateProp }, required: ["text"] },
    execute: i => { const t = todosFor(i.date || today()).find(x => x.text.toLowerCase().includes(i.text.toLowerCase())); if (!t) throw new Error("No matching task"); t.done = true; save("todos"); return { ok: true, task: t.text }; } },
  { name: "add_event", description: "Add an upcoming event (birthday, exam, appointment, trip, deadline).", inputSchema: { type: "object", properties: { title: { type: "string" }, date: { type: "string", description: "YYYY-MM-DD" }, time: { type: "string", description: "HH:MM 24h, optional" }, notes: { type: "string" }, type: { type: "string", enum: Object.keys(ETYPES) }, repeat_yearly: { type: "boolean", description: "true for birthdays/anniversaries" } }, required: ["title", "date"] },
    execute: i => { S.events.push({ id: uid(), title: i.title, date: i.date, time: i.time || "", notes: i.notes || "", type: i.type || "event", repeat: i.repeat_yearly || i.type === "birthday" ? "yearly" : "" }); save("events"); return { ok: true }; } },
  { name: "log_gym_today", description: "Log today's gym session with the muscle groups trained. Only works for today and only once per day; it locks after logging.", inputSchema: { type: "object", properties: { groups: { type: "array", items: { type: "string", enum: GROUPS.map(g => g[0]) }, description: "back, bi (biceps), chest, tri (triceps), shoulders, legs" } }, required: ["groups"] },
    execute: i => { if (wentOn(today())) throw new Error("Today's workout is already logged and locked."); gymPick = new Set((i.groups || []).filter(g => GNAME[g])); if (!logGymToday()) throw new Error("Pick at least one valid muscle group."); return { ok: true }; } },
  { name: "add_schedule_block", description: "Add a repeating weekly block to the schedule.", inputSchema: { type: "object", properties: { title: { type: "string" }, day: { type: "string", enum: DAYS }, start: { type: "string", description: "HH:MM 24h" }, end: { type: "string", description: "HH:MM 24h" } }, required: ["title", "day", "start", "end"] },
    execute: i => { S.schedule.push({ id: uid(), title: i.title, day: Math.max(0, DAYS.indexOf(i.day)), start: i.start, end: i.end, color: "blue" }); save("schedule"); return { ok: true }; } },
  { name: "save_study_material", description: "Save a study note, topic or link under one of the user's CSEC subjects.", inputSchema: { type: "object", properties: { subject: { type: "string", enum: SUBJECTS.map(s => s.k), description: SUBJECTS.map(s => s.k + "=" + s.name).join(", ") }, title: { type: "string" }, link: { type: "string" }, notes: { type: "string" } }, required: ["subject", "title"] },
    execute: i => { if (!SUBJ[i.subject]) throw new Error("Unknown subject"); S.study.push({ id: uid(), subject: i.subject, title: i.title, link: i.link || "", notes: i.notes || "", created: today() }); save("study"); return { ok: true }; } },
];

async function ask(q) {
  if (aiBusy) return;
  if (view !== "ai") view = "ai";
  chat.push({ role: "user", content: q });
  const reply = { role: "ai", content: "Thinking…" }; chat.push(reply);
  aiBusy = true; render();
  let sample = null;
  try { sample = await window.claude.use("sample"); } catch (e) {}
  if (!sample) { aiAvailable = false; reply.content = "I can't connect right now. Open Aurum from its claude.ai link while signed in, then try again."; aiBusy = false; render(); return; }
  aiAvailable = true;
  const history = chat.slice(-12, -2).map(m => `${m.role === "user" ? "User" : "Assistant"}: ${m.content}`).join("\n");
  const prompt = `You are the personal assistant inside Aurum, the user's own life-tracking app. You can see their data below. Be warm, direct and practical, like a sharp friend who keeps them on track. Keep answers short: plain text, short paragraphs or simple "-" lists, no markdown headings or bold. Use specifics from their data (times, counts, names). When they ask you to add, log, complete or check in something, call the matching tool, then confirm in one line. If a date or time is ambiguous, pick the most sensible one and say which you chose.

THEIR DATA (JSON):
${JSON.stringify(aiContext(), null, 1)}
${history ? `\nRECENT CONVERSATION:\n${history}\n` : ""}
User: ${q}`;
  try {
    const res = await sample(prompt, { cache: false, tools: AI_TOOLS, onText: ({ text }) => { reply.content = text || "Thinking…"; const log = $("#chatLog"); if (log && view === "ai") { log.lastElementChild.textContent = reply.content; } } });
    reply.content = (res && res.text) || reply.content;
  } catch (err) {
    if (err && err.code === "not_granted") { aiAvailable = false; reply.content = "The assistant needs your permission to run. Allow it when asked, then try again."; }
    else if (err && err.code === "rate_limited") reply.content = "I'm getting a lot of requests. Give it a minute and try again.";
    else reply.content = (err && err.text) || "Something went wrong reaching the assistant. Try again in a moment.";
  }
  aiBusy = false; render();
}

/* ---------- boot ---------- */
(function boot() {
  const hv = location.hash.slice(1); if (VIEWS[hv]) view = hv;
  if (!window.AURUM_FIREBASE || !window.AURUM_FIREBASE.apiKey) { $("#main").innerHTML = `<div class="wrap"><h1>Almost there</h1><p class="muted">Add your Firebase settings to firebase-config.js to finish setup.</p></div>`; return; }
  firebase.initializeApp(window.AURUM_FIREBASE);
  try { firebase.firestore().enablePersistence({ synchronizeTabs: true }).catch(() => {}); } catch (e) {}
  if (!loadLocal()) seed();
  migrate(); render();
  // login
  let mode = "in";
  const auth = firebase.auth(), box = $("#auth"), err = $("#authErr");
  const setMode = m => { mode = m; $("#authBtn").textContent = m === "in" ? "Sign in" : "Create account"; $("#authSwitch").textContent = m === "in" ? "New here? Create an account" : "Have an account? Sign in"; $("#authPass").autocomplete = m === "in" ? "current-password" : "new-password"; err.textContent = ""; };
  const msg = e => ({ "auth/invalid-credential": "Wrong email or password.", "auth/wrong-password": "Wrong email or password.", "auth/user-not-found": "No account with that email. Create one instead.", "auth/email-already-in-use": "That email already has an account. Sign in instead.", "auth/weak-password": "Use at least 6 characters.", "auth/invalid-email": "That email doesn't look right.", "auth/network-request-failed": "No internet connection. Try again when you're online.", "auth/too-many-requests": "Too many tries. Wait a minute and try again." }[e.code] || "Something went wrong. Try again.");
  $("#authSwitch").addEventListener("click", () => setMode(mode === "in" ? "up" : "in"));
  $("#authReset").addEventListener("click", async () => { const em = $("#authEmail").value.trim(); if (!em) { err.textContent = "Type your email first, then tap Forgot password."; return; } try { await auth.sendPasswordResetEmail(em); err.textContent = "Reset link sent. Check your email."; } catch (e) { err.textContent = msg(e); } });
  $("#authForm").addEventListener("submit", async e => {
    e.preventDefault(); e.stopPropagation(); err.textContent = "";
    const em = $("#authEmail").value.trim(), pw = $("#authPass").value;
    $("#authBtn").disabled = true;
    try { await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); if (mode === "in") await auth.signInWithEmailAndPassword(em, pw); else await auth.createUserWithEmailAndPassword(em, pw); }
    catch (e2) { err.textContent = msg(e2); }
    $("#authBtn").disabled = false;
  }, true);
  auth.onAuthStateChanged(u => {
    fbUser = u; box.hidden = !!u;
    if (u) connect(); else setSync("local");
  });
  window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (VIEWS[v] && v !== view) { view = v; render(); } });
  setInterval(() => { if (!sheetHandlers && !liftDragging && document.activeElement?.tagName !== "INPUT" && document.activeElement?.tagName !== "TEXTAREA") render(); }, 60000);
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
